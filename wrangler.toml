# Cloudflare Pages config. Enables `wrangler pages dev dist` (local Functions)
# and `wrangler pages deploy dist`. Astro build is unaffected — it just writes
# to dist/, which this points at.
name = "tenor-creative-site"
compatibility_date = "2025-04-03"
pages_build_output_dir = "dist"

# Non-secret runtime config. Because pages_build_output_dir is set, this file
# is the source of truth for plain vars — a git build overwrites dashboard vars.
# Secrets (TURNSTILE_SECRET_KEY, CRM_CLIENT_SECRET, RESEND_API_KEY) are set with
# `wrangler pages secret put` and are never committed.
[vars]
CRM_INGEST_URL = "https://crm.pricklypearmarketing.co/api/leads/ingest"
CRM_ACCOUNT_KEY = "WrfGcgV8IGo6IQ9MysaoG-XU_MIggbbV"
RESEND_FROM = "Tenor Creative <noreply@notify.pricklypearmarketingco.com>"
LEAD_FALLBACK_TO = "seth@pricklypearmarketingco.com"
